version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: computer_shop_db
    restart: always
    environment:
      POSTGRES_USER: MoNaLax
      POSTGRES_PASSWORD: 102549
      POSTGRES_DB: computer_shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: computer_shop_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: MoNaLax
      DB_PASSWORD: 102549
      DB_NAME: computer_shop
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: nginx:alpine
    container_name: computer_shop_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  pgdata:
